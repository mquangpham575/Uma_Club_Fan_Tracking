services:
  uma-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uma-tracker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SCHEDULE_UTC_TIME=10:15
      - DATABASE_URL=postgresql://umacore:${POSTGRES_PASSWORD}@postgres:5432/umacore
      - STATE_FILE=/app/data/state.json
    ports:
      - "${TRACKER_HOST_PORT:-8085}:8080"
    volumes:
      - ./config/credentials.json:/app/config/credentials.json:ro
      - tracker_data:/app/data
    networks:
      - umacore-net
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tracker_data:

networks:
  umacore-net:
    name: umacore-net
